[package]
name = "doyen"
version = "0.0.1"
description = "Pick one master among the instances of a service, through the database you already run. Work in progress: this version only reserves the name."
readme = "README.md"
keywords = ["leader-election", "fencing-token", "redis", "mongodb", "distributed"]
categories = ["concurrency", "database"]
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Failure paths of the CI (task 5.2 of add-ci-baseline). Throwaway branch, never merged.
[dependencies]
smallvec = "=1.6.0" # RUSTSEC-2021-0003: the deps job fails (advisory)
webpki-roots = "=0.25.4" # MPL-2.0, not on the allow list: the deps job fails (license)
itoa = { git = "https://github.com/dtolnay/itoa", tag = "1.0.11" } # the deps job fails (source)
