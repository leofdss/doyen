schema: spec-driven

context: |
  Project: doyen. A library that picks one master among the instances of one service,
  through a database the company already runs (Redis and MongoDB first, PostgreSQL later).
  There is no server of its own. One core in Rust; Node.js (napi-rs) and Go (C ABI + cgo)
  use it through bindings. Goal: a small portfolio project, finished and well tested. Keep
  the scope tight: done and well tested beats big.

  Language: English, simple. The owner is learning English: short sentences, common words.
  Keep OpenSpec headings and SHALL/MUST keywords in English.

  Owner decisions. Do not change them in a proposal. If one causes a real problem, say it
  and ask the owner.
  - Master = the oldest live member of a seniority line (numbers from a database counter).
    No vote, ever. A member that comes back joins at the end of the line.
  - Public API: the same five operations in every language, nothing more: join(config),
    status() (master | slave | offline; offline always has a reason), onStatusChange(cb),
    token() ((generation, number) or null), leave(). Do not add public methods.
  - The core is in Rust and opens its own database connection.
  - No Lua or other server-side scripts in Redis. MongoDB aggregation pipeline updates are
    allowed.
  - timeoutMs and renewIntervalMs are settings chosen by the team that uses doyen
    (defaults 10000 and 2000). join rejects timeoutMs < 3 x renewIntervalMs.
  - Unsafe setups: a risk beyond what is documented for that database -> refuse
    (DOYEN_UNSUPPORTED); a known, bounded risk -> a warning, once, at connect.
  - Releases: v0.1 = Rust crate + Redis + MongoDB; v0.2 = npm; v0.3 = Go; v0.4 = PostgreSQL.
  - Releases (owner decision 2026-11-05): GitHub Flow (short branches, pull request, rebase
    merge into main). One SemVer version and one tag v<version> for the crate, the npm
    packages and the Go module. release-please computes the version from the Conventional
    Commits (before 1.0: ! or feat -> minor, fix or perf -> patch) and keeps a release pull
    request. The owner merges it and approves the GitHub environment `release`; CI then
    publishes with Trusted Publishing (no stored tokens).
  - The owner makes the decisions marked "owner".
  - Tests are the source of truth (TDD, owner decision 2026-11-04): every spec scenario
    becomes an automated test, written and seen failing before the code that makes it pass.
    A test names its scenario in a comment: `spec: <capability> / <scenario>`. To change a
    behaviour, change its test first (and the spec in the same commit). Never change a test
    only to make it pass.
  - Code goes in the same commit as its spec (owner decision 2026-11-05). When code (tests
    included) belongs to an open change, the commit that adds or changes it also holds the
    spec changes it needs and the ticks in that change's tasks.md. Never code in one commit
    and its spec in another.
  - Code style (owner decision 2026-11-05): write code that TypeScript programmers can
    follow (Rust and Go too), and that people read and understand fast: not too short
    (clever one-liners, one-letter names), not too long (extra layers, comments that repeat
    the code). The rules are in AGENTS.md, "Code style".
  - AI use follows AI_POLICY.md (Linux Foundation guidance, owner decision 2026-11-05): a
    person is the author and is responsible; agents never add Signed-off-by or
    Co-authored-by; commits made with AI help end with `Assisted-by: <tool> (<model>)`. The
    security rules for code are in AGENTS.md, "Security"; the threat model is in SECURITY.md.

  Repo: Cargo workspace (edition 2024, MSRV Rust 1.85, resolver 3). Crate crates/doyen
  (core + adapters behind cargo features), npm package bindings/node (@leofdss/doyen), Go
  code in bindings/go (users get it from github.com/leofdss/doyen-go). Rust, Node.js and Go
  run inside the Distrobox container `doyen` (see distrobox/). Commits follow Conventional
  Commits. The order of the changes is in TODO.md.

rules:
  proposal:
    - Say which release (v0.1, v0.2, v0.3 or v0.4) the change belongs to.
    - List the changes this one depends on (see TODO.md).
  specs:
    - One capability belongs to one change. Never write a delta for a capability that another
      open change adds; refer to it by name instead.
    - Error and warning codes start with DOYEN_. Each code is defined in one capability only.
    - Write each scenario so it can become one automated test (clear WHEN and THEN).
    - "A requirement about secrets, untrusted input or memory safety has a negative scenario: it shows that doyen fails safe."
  design:
    - Record every assumption the owner has not confirmed under "Decisions" with the words
      "to confirm (owner)".
    - "Prefer the plain design a TypeScript programmer knows. When a Rust- or Go-only feature is needed (lifetimes, own macros, generics with many bounds, unsafe), say why."
  tasks:
    - "TDD: a task group with behaviour starts with a task that writes the tests for its scenarios and checks that they fail (red); the next tasks write the code until they pass (green), then clean up (refactor)."
    - "One task group is one commit: its tests, its code, the spec changes they need and its ticks in tasks.md (code goes with its spec). Stage the red tests (git add) before writing the code; every commit is green."
    - "The refactor step checks the code style rules of AGENTS.md (familiar to TypeScript programmers; not too short, not too long). Tests follow them too."
    - Use the model-tiering skill to choose the model and effort of each task group.
    - Commits follow Conventional Commits, type(scope) subject; scopes core, redis, mongodb,
      postgresql, node, go, ci, release, docs, deps.
    - "A task that adds a dependency says why and checks that it is the real package (AGENTS.md, Security)."
    - Mark the tasks that only the owner can do (merge a release pull request, approve a release, a setting, a decision) with "(owner)".
    - "Run Rust, Node.js and Go commands inside the container (distrobox enter doyen -- <command>)."
