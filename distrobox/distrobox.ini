# doyen development container, for `distrobox assemble`.
# Based on the StemLoft manifest (github.com/leofdss/stem-loft, distrobox/).
#
# Create it and enter it (from the repository root):
#
#   distrobox assemble create --file distrobox/distrobox.ini
#   distrobox enter doyen
#
# `assemble create` is not destructive: if a container named `doyen` exists,
# it leaves it alone. `--replace` deletes it and creates it again (for a new
# image). Only the container goes away: the work lives in the host's HOME
# and in the repository, which are shared.
[doyen]

# The image published by .github/workflows/build-dev-image.yml. To use a
# local build, see distrobox/README.md.
image=ghcr.io/leofdss/doyen-dev:latest

# Check the registry for a newer `latest` when the container is created
# (the image is rebuilt every week).
pull=true

# Run distrobox-init now, so the first `distrobox enter` is fast.
start_now=true

# No entry in the host's application menu: a terminal container.
entry=false

# No systemd: nothing here is a service. The test databases (Redis,
# MongoDB) run as Podman containers on the host (`distrobox-host-exec
# podman ...`), not inside this container.
init=false

# No GPU: nothing in doyen needs it.
nvidia=false

# No extra volumes: Distrobox already mounts the host's HOME, /mnt (so a
# repository on /mnt/d is at the same path inside), /tmp, /dev, and the
# whole host file system under /run/host.

# No `additional_packages`: every tool belongs in the Containerfile, where
# it is part of the published image.
