name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt

      - name: Install workspace dependencies
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust
        run: npm run lint:rust

      - name: Test Rust
        run: npm run test:rust

      - name: Build library and NestJS consumer
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Test packed library in NestJS
        run: npm run test:nestjs

      - name: Lint NestJS consumer
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Upload tested npm package
        uses: actions/upload-artifact@v4
        with:
          name: doyen-npm-package
          path: dist/packages/doyen/*.tgz
          if-no-files-found: error
